<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenes</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  .vscene {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 0.55s ease;
    pointer-events: none;
  }
  .vscene.active { opacity: 1; }
  .vscene video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* сегменти */
  #segs {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 6px;
  }
  .seg {
    height: 2px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .seg-fill {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.85);
    transition: width 0.08s linear;
  }

  #ctr {
    position: fixed;
    right: 28px; bottom: 22px;
    z-index: 20;
    color: rgba(255,255,255,0.3);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  #hint {
    position: fixed;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-family: sans-serif;
    transition: opacity 1s;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="vscene active" id="s0"><video src="1.mp4" muted playsinline preload="auto"></video></div>
<div class="vscene"        id="s1"><video src="2.mp4" muted playsinline preload="auto"></video></div>
<div class="vscene"        id="s2"><video src="3.mp4" muted playsinline preload="auto"></video></div>
<div class="vscene"        id="s3"><video src="4.mp4" muted playsinline preload="auto"></video></div>

<div id="segs"></div>
<div id="ctr">01 / 04</div>
<div id="hint">scroll to explore</div>

<script>
  const VIDEOS = ['1.mp4','2.mp4','3.mp4','4.mp4'];
  const SEC_PER_VIDEO = 7;   // секунд у кожному відео
  const SCENES_PER_VIDEO = 7;
  const TOTAL_SCENES = VIDEOS.length * SCENES_PER_VIDEO; // 28

  const wrappers = Array.from(document.querySelectorAll('.vscene'));
  const videos   = wrappers.map(w => w.querySelector('video'));
  const segsEl   = document.getElementById('segs');
  const ctr      = document.getElementById('ctr');
  const hint     = document.getElementById('hint');

  // поточна глобальна сцена 0..27
  let globalScene = 0;
  let crossing    = false; // йде crossfade між відео

  // ── build segments ──────────────────────────────────────────────────
  for (let i = 0; i < TOTAL_SCENES; i++) {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.width = (Math.floor(560 / TOTAL_SCENES) - 2) + 'px';
    seg.innerHTML = '<div class="seg-fill"></div>';
    seg.dataset.i = i;
    seg.addEventListener('click', () => goToScene(i));
    segsEl.appendChild(seg);
  }
  const segEls = Array.from(segsEl.querySelectorAll('.seg'));

  // ── helpers ──────────────────────────────────────────────────────────
  function vidIdx(scene)  { return Math.floor(scene / SCENES_PER_VIDEO); }
  function frameInVid(scene) { return scene % SCENES_PER_VIDEO; }

  function updateUI(scene) {
    const vi = vidIdx(scene);
    const fi = frameInVid(scene);
    ctr.textContent = String(scene + 1).padStart(2,'0') + ' / ' + String(TOTAL_SCENES).padStart(2,'0');
    segEls.forEach((s, i) => {
      const fill = s.querySelector('.seg-fill');
      if (i < scene)      fill.style.width = '100%';
      else if (i === scene) fill.style.width = '60%';
      else                  fill.style.width = '0%';
    });
  }

  // ── crossfade between video layers ──────────────────────────────────
  function crossfadeTo(newVidIdx, cb) {
    if (crossing) return;
    crossing = true;

    const oldVidIdx = wrappers.findIndex(w => w.classList.contains('active'));
    if (oldVidIdx === newVidIdx) { crossing = false; cb && cb(); return; }

    // показуємо новий поверх старого
    wrappers[newVidIdx].classList.add('active');

    // після transition ховаємо старий
    setTimeout(() => {
      wrappers[oldVidIdx].classList.remove('active');
      crossing = false;
      cb && cb();
    }, 580);
  }

  // ── go to specific global scene ──────────────────────────────────────
  function goToScene(scene) {
    if (scene < 0 || scene >= TOTAL_SCENES) return;
    const vi = vidIdx(scene);
    const fi = frameInVid(scene);
    const t  = fi * (SEC_PER_VIDEO / SCENES_PER_VIDEO);

    const prevVi = vidIdx(globalScene);
    globalScene = scene;
    hint.classList.add('hidden');
    updateUI(scene);

    if (vi !== prevVi) {
      // потрібен перехід між відео
      videos[vi].currentTime = t;
      crossfadeTo(vi);
    } else {
      // те саме відео — просто seekаємо
      videos[vi].currentTime = t;
    }
  }

  // ── wheel ────────────────────────────────────────────────────────────
  let wBuf = 0, wTm = null;
  const THRESH = 40;

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (crossing) return;

    wBuf += e.deltaY;
    clearTimeout(wTm);
    wTm = setTimeout(() => { wBuf = 0; }, 250);

    if (wBuf >= THRESH) {
      wBuf = 0;
      goToScene(globalScene + 1);
    } else if (wBuf <= -THRESH) {
      wBuf = 0;
      goToScene(globalScene - 1);
    }
  }, { passive: false });

  // ── touch ─────────────────────────────────────────────────────────────
  let ty0 = null;
  window.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (ty0 === null) return;
    const dy = ty0 - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) goToScene(globalScene + (dy > 0 ? 1 : -1));
    ty0 = null;
  }, { passive: true });

  // ── keyboard ──────────────────────────────────────────────────────────
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') goToScene(globalScene + 1);
    if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  goToScene(globalScene - 1);
  });

  // ── init ──────────────────────────────────────────────────────────────
  videos.forEach(v => {
    v.pause();
    v.addEventListener('loadedmetadata', () => { v.currentTime = 0; });
  });
  updateUI(0);
</script>
</body>
</html>
